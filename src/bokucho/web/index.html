<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bokucho</title>
    <link rel="stylesheet" href="assets/theme.css" />
  </head>
  <body>
    <div class="window-resize-zone window-resize-top" data-resize-edge="top"></div>
    <div class="window-resize-zone window-resize-top-right" data-resize-edge="top-right"></div>
    <div class="window-resize-zone window-resize-right" data-resize-edge="right"></div>
    <div class="window-resize-zone window-resize-bottom-right" data-resize-edge="bottom-right"></div>
    <div class="window-resize-zone window-resize-bottom" data-resize-edge="bottom"></div>
    <div class="window-resize-zone window-resize-bottom-left" data-resize-edge="bottom-left"></div>
    <div class="window-resize-zone window-resize-left" data-resize-edge="left"></div>
    <div class="window-resize-zone window-resize-top-left" data-resize-edge="top-left"></div>
    <div id="app">
      <header id="project-bar">
        <div id="window-drag-region">
          <span id="wordmark">Bokucho</span>
          <span class="bar-divider" aria-hidden="true"></span>
          <button id="project-title" type="button"></button>
        </div>
        <div id="bar-controls">
          <span id="reviewed-percentage" class="mono"></span>
          <button id="theme-toggle" class="bar-button" type="button">
            <svg
              class="theme-glyph theme-glyph-sun"
              width="13"
              height="13"
              viewBox="0 0 15 15"
              fill="none"
              stroke="currentColor"
              stroke-width="1.3"
              stroke-linecap="round"
              aria-hidden="true"
            >
              <circle cx="7.5" cy="7.5" r="2.8"></circle>
              <path
                d="M7.5 1v1.4M7.5 12.6V14M1 7.5h1.4M12.6 7.5H14M2.9 2.9l1 1M11.1 11.1l1 1M12.1 2.9l-1 1M3.9 11.1l-1 1"
              ></path>
            </svg>
            <svg
              class="theme-glyph theme-glyph-moon"
              width="13"
              height="13"
              viewBox="0 0 15 15"
              fill="currentColor"
              aria-hidden="true"
            >
              <path d="M7.5 1.2a6.3 6.3 0 1 0 6.1 7.9 5.05 5.05 0 0 1-6.1-7.9z"></path>
            </svg>
          </button>
          <div id="window-controls" aria-label="Window controls">
            <button
              id="window-minimize-button"
              class="window-control window-control-minimize"
              type="button"
              aria-label="Minimize"
              title="Minimize"
            ></button>
            <button
              id="window-maximize-button"
              class="window-control window-control-maximize"
              type="button"
              aria-label="Maximize"
              title="Maximize"
            ></button>
            <button
              id="window-close-button"
              class="window-control window-control-close"
              type="button"
              aria-label="Close"
              title="Close"
            ></button>
          </div>
        </div>
      </header>
      <div id="error-banner" hidden>
        <div class="error-header">
          <span id="error-message" role="alert"></span>
          <button id="error-details-button" class="btn" type="button" hidden></button>
          <button id="error-dismiss-button" class="btn" type="button"></button>
        </div>
        <pre id="error-details" hidden></pre>
      </div>
      <div id="content">
        <div id="launcher-page"></div>
        <div id="workspace" hidden>
          <nav id="sidebar"></nav>
          <h1 id="page-heading" class="visually-hidden"></h1>
          <main id="page"></main>
        </div>
      </div>
      <footer id="job-bar" class="job-idle">
        <div class="job-header">
          <span class="job-dot" aria-hidden="true"></span>
          <button id="job-status" type="button"></button>
          <progress id="job-progress" max="1" value="0"></progress>
          <span id="job-percentage" class="mono"></span>
          <button id="job-cancel-button" class="btn" type="button" disabled></button>
          <button id="job-history-button" class="btn" type="button"></button>
        </div>
        <div id="job-progress-detail" class="mono muted" hidden></div>
        <pre id="job-log" class="mono" hidden></pre>
      </footer>
      <div id="job-announcer" class="visually-hidden" role="status"></div>
      <div id="conflict-dialog" hidden>
        <div
          id="conflict-panel"
          tabindex="-1"
          role="alertdialog"
          aria-modal="true"
          aria-labelledby="conflict-description"
          aria-describedby="conflict-identity"
        >
          <p id="conflict-description"></p>
          <p id="conflict-identity" class="muted"></p>
          <p id="conflict-error" class="severity-error" role="alert" hidden></p>
          <div class="conflict-actions">
            <button id="conflict-accept-disk" class="btn" type="button"></button>
            <button id="conflict-keep-draft" class="btn btn-primary" type="button"></button>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="assets/app.js"></script>
  </body>
</html>
