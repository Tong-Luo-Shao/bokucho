<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <clipPath id="tile"><rect x="4" y="4" width="248" height="248" rx="54"/></clipPath>
    <path id="NF" d="M134 128 C122 112 104 92 84 72 C70 58 54 46 36 40 C30 44 28 52 30 60 C33 70 31 78 36 88 C40 96 38 104 46 112 C52 120 54 124 64 128 C80 136 104 140 130 140 Z"/>
    <path id="NH" d="M132 144 C116 146 96 150 80 160 C70 166 62 176 60 186 C58 194 64 196 62 202 C66 210 74 206 80 212 C88 216 94 208 102 208 C114 204 124 186 130 168 C132 160 134 152 134 148 Z"/>
    <path id="FF" d="M142 126 C150 104 164 78 184 58 C194 48 206 42 216 44 C220 52 218 62 214 70 C210 80 210 88 202 96 C192 108 170 120 146 132 Z"/>
    <path id="FH" d="M144 138 C160 142 178 150 188 162 C194 170 192 178 186 182 C180 188 172 184 166 186 C156 182 148 164 144 146 Z"/>
    <clipPath id="near"><use xlink:href="#NF"/><use xlink:href="#NH"/></clipPath>
    <clipPath id="far"><use xlink:href="#FF"/><use xlink:href="#FH"/></clipPath>
    <filter id="grain" x="0" y="0" width="256" height="256" filterUnits="userSpaceOnUse">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="3"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.42  0 0 0 0 0.35  0 0 0 0 0.24  0 0 0 0.2 0"/>
    </filter>
    <filter id="fibre" x="0" y="0" width="256" height="256" filterUnits="userSpaceOnUse">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.18" numOctaves="2" seed="5"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.55  0 0 0 0 0.48  0 0 0 0 0.36  0 0 0 0.14 0"/>
    </filter>
    <!-- Ink spreading into wet paper: a wavering edge, softened. -->
    <filter id="wash" x="-25%" y="-25%" width="150%" height="150%">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="3" seed="7" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="8" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feGaussianBlur in="d" stdDeviation="1.6"/>
    </filter>
    <!-- Pigment settling in grains, as on the dark wing margins. -->
    <filter id="speck" x="-15%" y="-15%" width="130%" height="130%">
      <feTurbulence type="fractalNoise" baseFrequency="0.32" numOctaves="2" seed="13" result="n"/>
      <feComponentTransfer in="n" result="m"><feFuncA type="discrete" tableValues="0 0 0 1 1 1 1"/></feComponentTransfer>
      <feComposite in="SourceGraphic" in2="m" operator="in" result="s"/>
      <feDisplacementMap in="s" in2="n" scale="5" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feGaussianBlur in="d" stdDeviation="0.5"/>
    </filter>
    <!-- A drawn line that bled a little: a crisp, wavering core with a soft halo. -->
    <filter id="bleed" x="-15%" y="-15%" width="130%" height="130%">
      <feTurbulence type="fractalNoise" baseFrequency="0.09" numOctaves="2" seed="11" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="2" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feGaussianBlur in="d" stdDeviation="0.9" result="soft"/>
      <feMerge><feMergeNode in="soft"/><feMergeNode in="d"/></feMerge>
    </filter>
  </defs>

  <g clip-path="url(#tile)">
    <rect width="256" height="256" fill="#ece5d5"/>
    <rect width="256" height="256" filter="url(#fibre)"/>
    <rect width="256" height="256" filter="url(#grain)"/>
  </g>
  <rect x="5.5" y="5.5" width="245" height="245" rx="52.5" fill="none" stroke="#cbbfa6" stroke-width="3"/>

  <g fill="#e3e7e3"><use xlink:href="#FF"/><use xlink:href="#FH"/></g>
  <g clip-path="url(#far)" fill="#14181a">
    <g filter="url(#wash)">
      <path d="M200 42 C214 38 222 50 218 62 C214 72 204 70 198 62 C194 56 194 46 200 42 Z" opacity="0.7"/>
      <path d="M150 126 C158 120 166 122 164 130 C160 136 152 136 148 132 Z" opacity="0.25"/>
    </g>
    <g filter="url(#speck)">
      <path d="M214 46 C222 56 218 72 212 84 C208 92 204 96 200 98 L232 104 L232 40 Z" opacity="0.9"/>
      <path d="M190 162 C196 172 192 182 184 186 L166 190 L196 196 L200 160 Z" opacity="0.9"/>
    </g>
  </g>
  <g fill="none" stroke="#14181a" stroke-linecap="round" filter="url(#bleed)">
    <path d="M144 128 C166 104 190 74 214 48" stroke-width="1.6"/>
    <path d="M145 131 C170 112 194 90 214 70" stroke-width="1.3"/>
    <path d="M146 134 C168 124 190 108 204 96" stroke-width="1.3"/>
    <path d="M146 140 C164 150 178 162 188 172" stroke-width="1.3"/>
    <use xlink:href="#FF" stroke-width="2" stroke-linejoin="round"/>
    <use xlink:href="#FH" stroke-width="2" stroke-linejoin="round"/>
  </g>

  <g fill="#fcfcf9"><use xlink:href="#NF"/><use xlink:href="#NH"/></g>
  <g clip-path="url(#near)" fill="#14181a">
    <g filter="url(#wash)">
      <path d="M30 38 C46 34 64 44 70 58 C74 70 62 76 52 74 C42 86 30 84 27 72 C24 60 22 44 30 38 Z" opacity="0.75"/>
      <path d="M22 56 C30 74 32 94 40 110 C46 120 54 126 62 130 L10 140 L10 50 Z" opacity="0.3"/>
      <path d="M146 122 C130 112 114 116 112 126 C110 138 124 146 138 146 Z" opacity="0.2"/>
      <path d="M136 144 C122 144 112 152 114 162 C118 170 128 166 134 156 Z" opacity="0.18"/>
      <path d="M56 184 C70 192 92 200 112 206 L112 224 L50 224 Z" opacity="0.4"/>
      <circle cx="60" cy="128" r="3.5" opacity="0.45"/>
      <circle cx="44" cy="108" r="3.2" opacity="0.45"/>
      <circle cx="36" cy="82" r="3" opacity="0.45"/>
    </g>
    <g filter="url(#speck)">
      <path d="M36 44 C42 64 44 82 50 96 C56 108 64 116 74 124 L10 140 L10 40 Z" opacity="0.9"/>
      <path d="M58 190 C70 198 90 206 108 210 L108 226 L50 226 Z" opacity="0.95"/>
    </g>
    <g fill="none" stroke="#14181a" stroke-width="6" stroke-linecap="round" opacity="0.1" filter="url(#wash)">
      <path d="M134 131 C108 106 74 78 36 60"/>
      <path d="M134 134 C106 116 70 96 34 82"/>
      <path d="M132 148 C114 162 94 184 74 208"/>
    </g>
  </g>
  <g fill="none" stroke="#14181a" stroke-linecap="round" filter="url(#bleed)">
    <path d="M134 128 C110 100 80 66 40 42" stroke-width="2.4"/>
    <path d="M134 131 C108 106 74 78 36 60" stroke-width="1.9"/>
    <path d="M134 134 C106 116 70 96 34 82" stroke-width="1.9"/>
    <path d="M134 137 C108 126 76 114 44 108" stroke-width="1.7"/>
    <path d="M134 140 C112 136 88 132 62 128" stroke-width="1.6"/>
    <path d="M132 146 C110 154 84 170 62 190" stroke-width="1.7"/>
    <path d="M132 148 C114 162 94 184 74 208" stroke-width="1.5"/>
    <path d="M133 151 C122 172 110 192 98 208" stroke-width="1.5"/>
    <path d="M134 153 C130 172 126 186 120 196" stroke-width="1.2"/>
    <use xlink:href="#NF" stroke-width="2.8" stroke-linejoin="round"/>
    <use xlink:href="#NH" stroke-width="2.8" stroke-linejoin="round"/>
  </g>
  <path d="M120 112 C104 94 86 76 66 60" fill="none" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" opacity="0.85"/>

  <g fill="none" stroke="#14181a" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M140 132 L128 146 L122 150"/>
    <path d="M144 134 L136 152 L132 160"/>
    <path d="M148 132 L146 150 L144 158"/>
  </g>
  <g fill="#14181a" filter="url(#bleed)">
    <path d="M146 118 C152 124 150 132 144 140 C136 154 124 170 112 190 C108 196 102 196 104 188 C110 170 120 150 132 132 C136 124 140 116 146 118 Z"/>
    <circle cx="144" cy="124" r="8.5"/>
    <circle cx="152" cy="113" r="5.5"/>
  </g>
  <g fill="none" stroke="#14181a" stroke-width="1.8" stroke-linecap="round">
    <path d="M155 109 C163 94 173 82 188 74"/>
    <path d="M151 108 C155 90 161 76 170 64"/>
  </g>
  <g fill="#14181a" filter="url(#bleed)">
    <circle cx="188" cy="74" r="2.8"/><circle cx="170" cy="64" r="2.8"/>
    <circle cx="20" cy="30" r="2.6"/><circle cx="26" cy="20" r="1.5"/>
  </g>
</svg>
